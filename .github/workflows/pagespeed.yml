name: PageSpeed

# Re-measures every site in .github/psi-sites.json against Google's PageSpeed
# Insights API and commits the result: the README table, the shields badge
# payloads, and the raw JSON under data/psi.
#
# Needs one repository secret, PAGESPEED_API_KEY — a free Google Cloud API key
# with the PageSpeed Insights API enabled. Without it the request falls back to
# the anonymous quota, which is shared across the whole internet and is almost
# always exhausted (HTTP 429).
#
# Run it manually with `dry` checked to see the numbers in the job log before
# anything is written to a public README.

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch:
    inputs:
      dry:
        description: 'Measure and print only — commit nothing (includes sites not yet in the table)'
        type: boolean
        default: false
      only:
        description: 'Comma-separated substrings — measure just these sites'
        type: string
        default: ''
  push:
    branches: [main] # a side branch can be measured on demand with `dry`
    paths:
      - '.github/psi-sites.json'
      - '.github/scripts/psi.mjs'
      - '.github/workflows/pagespeed.yml'

permissions:
  contents: write

concurrency:
  group: readme-writers # the health workflow rewrites the same README
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Measure
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        # A dry run is for looking, so it measures every site including the
        # ones held out of the published table.
        run: node .github/scripts/psi.mjs ${{ inputs.dry && '--dry --all' || '' }} ${{ inputs.only && format('--only={0}', inputs.only) || '' }}

      - name: Commit the new numbers
        # Not success(): a run that lost one request out of four still
        # measured the rest, and dropping all of it was how a whole publish
        # went missing. The job still reports failure afterwards.
        if: ${{ !cancelled() && !inputs.dry }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Scores unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data
          git commit -m "chore(psi): re-measured $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash
          git push
